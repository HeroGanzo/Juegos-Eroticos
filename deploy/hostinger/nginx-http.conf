# Etapa temporal: solo permite el desafío ACME; no publica la aplicación por HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name juegosparaelganso.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
