# Instalar solo después de emitir el certificado con Certbot.
server {
    listen 80;
    listen [::]:80;
    server_name juegosparaelganso.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://juegosparaelganso.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name juegosparaelganso.com;

    ssl_certificate /etc/letsencrypt/live/juegosparaelganso.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juegosparaelganso.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/upload {
        # 150 MiB de video más el formulario multipart. Nginx recibe el cuerpo
        # completo antes de pasarlo a Next, que valida el tamaño del archivo.
        client_max_body_size 155m;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:3000;
    }
}
