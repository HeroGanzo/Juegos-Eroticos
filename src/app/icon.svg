<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Mano ahorcando ganso</title>
  <!-- CUELLO GANSO -->
  <path d="M28 100 C28 75 28 60 34 38 L54 38 C48 60 48 75 48 100 Z" fill="#FFFFFF" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
  <!-- arrugas por presión -->
  <path d="M32 60 Q40 62 46 60" stroke="#111" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M32 70 Q40 72 46 70" stroke="#111" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- CABEZA -->
  <ellipse cx="66" cy="28" rx="20" ry="15" fill="#FFFFFF" stroke="#111" stroke-width="3"/>

  <!-- OJO GRITANDO -->
  <circle cx="66" cy="24" r="7" fill="white" stroke="#111" stroke-width="2.5"/>
  <circle cx="67.5" cy="25" r="3" fill="black"/>
  <circle cx="68.5" cy="24" r="1" fill="white"/>
  <path d="M59 18 L62 21 M73 17 L70 20" stroke="red" stroke-width="1.5" stroke-linecap="round"/>

  <!-- INTERIOR BOCA ABIERTA -->
  <ellipse cx="84" cy="30" rx="7" ry="8" fill="#5a0a0a" stroke="#111" stroke-width="2"/>
  <!-- PICO SUPERIOR -->
  <path d="M75 20 L99 16 L86 26 Z" fill="#FF9F1C" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- PICO INFERIOR -->
  <path d="M76 36 L97 44 L84 34 Z" fill="#FF9F1C" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- LENGUA -->
  <path d="M80 33 Q86 36 90 38" stroke="#FF5A5A" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- MANO AHORCANDO -->
  <!-- palma izquierda -->
  <rect x="4" y="45" width="28" height="30" rx="8" fill="#F4B183" stroke="#111" stroke-width="3"/>
  <path d="M14 45 V75 M22 45 V75" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <!-- pulgar arriba haciendo presión -->
  <ellipse cx="36" cy="42" rx="9" ry="6" fill="#F4B183" stroke="#111" stroke-width="2.8"/>
  <!-- 4 dedos agarrando el cuello por delante -->
  <g fill="#F4B183" stroke="#111" stroke-width="2.8">
    <rect x="42" y="44" width="20" height="8" rx="4"/>
    <rect x="42" y="54" width="20" height="8" rx="4"/>
    <rect x="42" y="64" width="20" height="8" rx="4"/>
    <rect x="40" y="74" width="18" height="7" rx="3.5"/>
  </g>

  <!-- SALIVA BLANCA BABEANDO -->
  <g fill="white" stroke="#6EBBFF" stroke-width="2">
    <path d="M86 40 Q88 48 83 52 Q78 56 79 48 Q80 42 86 40 Z"/>
    <circle cx="76" cy="50" r="3.5"/>
    <circle cx="70" cy="58" r="2.8"/>
    <circle cx="89" cy="56" r="4.2"/>
    <path d="M89 60 Q90 67 87 70 Q84 67 85 60 Z"/>
  </g>

  <!-- LINEAS DE GRITO -->
  <g stroke="#111" stroke-width="2.5" stroke-linecap="round">
    <line x1="92" y1="8" x2="88" y2="14"/>
    <line x1="62" y1="5" x2="64" y2="12"/>
  </g>
</svg>
