Aquí tienes una versión caricaturesca y sin heridas ni detalles gráficos. Guárdala como `icon.svg`:

```svg
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Ganso con la boca abierta</title>
  <desc id="desc">Icono caricaturesco de un ganso con el pico abierto, saliva y una mano sujetándole el cuello.</desc>

  <!-- Fondo -->
  <circle cx="128" cy="128" r="116"
          fill="#FFF7E7"
          stroke="#263342"
          stroke-width="6"/>

  <!-- Líneas de grito -->
  <path d="M215 69l8-6 M220 79l9-1"
        fill="none"
        stroke="#E27A5D"
        stroke-width="4"
        stroke-linecap="round"/>

  <!-- Cuello y cabeza -->
  <path d="M108 177
           C115 162 119 147 119 132
           L119 111
           C119 96 120 85 129 76
           C138 67 151 63 165 65
           C179 67 188 75 191 85
           C194 94 190 102 183 107
           C176 112 165 113 155 108
           C150 106 146 102 143 98
           C140 119 141 142 147 160
           L153 177 Z"
        fill="#FFFFFF"
        stroke="#263342"
        stroke-width="6"
        stroke-linejoin="round"/>

  <!-- Cuerpo -->
  <path d="M49 180
           C44 176 39 171 35 165
           C45 165 54 169 61 175
           C65 160 79 151 96 151
           C115 151 130 162 135 177
           C140 192 126 202 110 206
           C90 212 65 203 53 192
           C50 188 48 184 49 180 Z"
        fill="#FFFFFF"
        stroke="#263342"
        stroke-width="6"
        stroke-linejoin="round"/>

  <!-- Ala -->
  <path d="M67 181
           C78 166 98 165 115 175
           C106 189 86 195 69 187 Z"
        fill="#F1F4F6"
        stroke="#C7D0D8"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Ojo -->
  <ellipse cx="173" cy="81" rx="6" ry="7"
           fill="#FFFFFF"
           stroke="#263342"
           stroke-width="3"/>
  <circle cx="175" cy="82" r="3" fill="#263342"/>

  <!-- Pico inferior -->
  <path d="M193 108
           C201 109 209 106 216 102
           C214 112 207 118 200 117
           C196 117 193 113 193 108 Z"
        fill="#F3A23B"
        stroke="#263342"
        stroke-width="4"
        stroke-linejoin="round"/>

  <!-- Boca abierta -->
  <path d="M191 100
           C199 98 208 98 216 100
           C212 106 204 109 193 109 Z"
        fill="#713B4A"
        stroke="#263342"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Pico superior -->
  <path d="M187 85
           C198 84 209 88 218 94
           C221 96 219 99 215 100
           L192 104
           C194 97 192 91 187 85 Z"
        fill="#F3A23B"
        stroke="#263342"
        stroke-width="4"
        stroke-linejoin="round"/>

  <!-- Mano sujetando el cuello -->
  <path d="M20 116
           H68
           C76 116 79 111 84 106
           C90 100 99 101 105 106
           C111 111 118 114 124 116
           C130 117 133 121 131 125
           C129 129 125 129 120 127
           L137 128
           C142 128 145 132 143 136
           C141 140 137 140 132 139
           L121 138
           C126 141 126 145 123 148
           C120 151 116 150 112 147
           L99 142
           L82 143
           L68 140
           H20 Z"
        fill="#E8A083"
        stroke="#263342"
        stroke-width="6"
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Pliegues de la mano -->
  <path d="M81 116 C86 110 92 109 98 112 L109 118
           M105 129 C114 132 124 134 137 134
           M99 138 C106 140 111 143 116 146"
        fill="none"
        stroke="#B86F59"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Saliva -->
  <path d="M205 115 C206 121 211 122 209 128"
        fill="none"
        stroke="#9FC3D0"
        stroke-width="7"
        stroke-linecap="round"/>
  <path d="M205 115 C206 121 211 122 209 128"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"/>

  <path d="M209 126
           C205 132 202 135 204 139
           C206 143 212 143 215 139
           C218 135 213 131 209 126 Z"
        fill="#FFFFFF"
        stroke="#9FC3D0"
        stroke-width="3"/>

  <path d="M222 119
           C219 123 218 125 220 128
           C222 130 225 128 226 126
           C226 124 224 121 222 119 Z"
        fill="#FFFFFF"
        stroke="#9FC3D0"
        stroke-width="2"/>
</svg>
```
